name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on iOS ${{ matrix.ios }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # iOS 26 = Liquid Glass, iOS 18 = fallback styling (README §5).
        include:
          - ios: "26"
            device: iPhone 17
          - ios: "18"
            device: iPhone 16
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Ensure iOS ${{ matrix.ios }} simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS ${{ matrix.ios }}\."; then
            xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.ios }}.0
          fi
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r --arg v "${{ matrix.ios }}." \
            '[.runtimes[] | select(.platform == "iOS" and (.version | startswith($v)))] | last | .identifier')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r --arg n "${{ matrix.device }}" \
            '.devicetypes[] | select(.name == $n) | .identifier')
          UDID=$(xcrun simctl create "CI ${{ matrix.device }}" "$DEVICE_TYPE" "$RUNTIME")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Not3.xcodeproj -scheme Not3 \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || exit 1

  backend:
    name: Edge Functions type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno lint supabase/functions
      - run: deno test --allow-env --allow-net=api.deepseek.com supabase/functions
