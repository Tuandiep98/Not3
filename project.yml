name: Not3
options:
  bundleIdPrefix: com.tuandiep
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  developmentLanguage: vi
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "8CH38V6M42"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  Not3:
    type: application
    platform: iOS
    sources:
      - Not3
      - Shared
      # Widget views are also compiled into the app for the DEBUG widget gallery and so
      # interactive intents exist in both processes.
      - path: Not3Widgets
        excludes: [Not3WidgetBundle.swift, Info.plist, "*.entitlements"]
    dependencies:
      - package: Supabase
        product: Supabase
      - target: Not3Widgets
        embed: true
      - target: Not3Share
        embed: true
      - target: Not3Watch
    entitlements:
      path: Not3/Resources/Not3.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-container-identifiers:
          [iCloud.com.tuandiep.not3]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.tuandiep.not3]
        # Reminders at a time the user chose may break through Focus.
        com.apple.developer.usernotifications.time-sensitive: true
        # Module "Sức khỏe": read only (no clinical records).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Module "Gợi ý nhật ký" (JournalingSuggestionsPicker).
        com.apple.developer.journal.allow: [suggestions]
    info:
      path: Not3/Resources/Info.plist
      properties:
        CFBundleDisplayName: Not3
        CFBundleDevelopmentRegion: vi
        # Only HTTPS / Apple crypto (exempt): skips the TestFlight "Missing Compliance" prompt.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.tuandiep.not3.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: com.tuandiep.not3
            CFBundleURLSchemes: [not3]
        NSCalendarsFullAccessUsageDescription: Not3 đọc lịch hôm nay để gợi ý việc buổi sáng lúc check-in, và ghi kế hoạch buổi chiều vào lịch "Not3".
        NSRemindersFullAccessUsageDescription: Not3 đưa lời nhắc đến hạn vào việc hôm nay và đánh dấu xong lời nhắc khi bạn tick việc đó.
        NSHealthShareUsageDescription: Not3 đọc bài tập, chánh niệm, số bước và giấc ngủ để ghi việc đã làm vào Nhật ký và Tổng kết tuần. Dữ liệu chỉ xử lý trên iPhone, không gửi lên server.
        NSCameraUsageDescription: Not3 dùng camera để bạn chụp ảnh đính kèm vào ghi chú.
        NSFaceIDUsageDescription: Not3 dùng Face ID để mở khoá app khi bạn bật "Khoá bằng Face ID".
        NSMicrophoneUsageDescription: Not3 dùng micro để bạn nói việc cần làm thay vì gõ.
        NSSpeechRecognitionUsageDescription: Not3 chuyển giọng nói thành chip việc cần làm, xử lý trên máy khi có thể.
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuandiep.not3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  Not3Widgets:
    type: app-extension
    platform: iOS
    sources:
      - Not3Widgets
      - Shared
      - path: Not3/Resources/Assets.xcassets
        buildPhase: resources
    entitlements:
      path: Not3Widgets/Not3Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tuandiep.not3]
    info:
      path: Not3Widgets/Info.plist
      properties:
        CFBundleDisplayName: Not3
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuandiep.not3.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  Not3Share:
    type: app-extension
    platform: iOS
    sources:
      - Not3Share
      - Shared
    entitlements:
      path: Not3Share/Not3Share.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tuandiep.not3]
    info:
      path: Not3Share/Info.plist
      properties:
        CFBundleDisplayName: Not3
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuandiep.not3.share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  Not3Watch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - Not3Watch
      - Shared
    dependencies:
      - target: Not3WatchWidgets
        embed: true
    entitlements:
      path: Not3Watch/Not3Watch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tuandiep.not3]
    info:
      path: Not3Watch/Info.plist
      properties:
        CFBundleDisplayName: Not3
        CFBundleDevelopmentRegion: vi
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.tuandiep.not3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuandiep.not3.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WATCH_APP"
        SKIP_INSTALL: YES
  Not3WatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - Not3WatchWidgets
      - Shared
    entitlements:
      path: Not3WatchWidgets/Not3WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tuandiep.not3]
    info:
      path: Not3WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Not3
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuandiep.not3.watchkitapp.widgets
        SKIP_INSTALL: YES
  Not3Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Not3Tests
    dependencies:
      - target: Not3
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Not3:
    build:
      targets:
        Not3: all
        Not3Tests: [test]
    test:
      targets:
        - Not3Tests
